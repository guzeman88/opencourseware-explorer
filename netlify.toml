[build]
  base = "web"
  command = "npm run build"
  publish = ".next"
  functions = "../netlify/functions"

[build.environment]
  # Backend target used by the cache-aware Next.js API route.
  API_UPSTREAM = "https://opencourseware-api.onrender.com"
  # Keep browser requests on the deployed site's /api/v1 route.
  NEXT_PUBLIC_API_URL = ""

[[plugins]]
  package = "@netlify/plugin-nextjs"
