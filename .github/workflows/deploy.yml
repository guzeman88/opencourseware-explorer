name: Deploy to Vercel + Netlify

on:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r scraper/requirements.txt

      - name: Check tracked files for committed secrets
        run: python scripts/check_tracked_secrets.py

      - name: Test backend
        working-directory: backend
        run: python -m pytest -q

      - name: Test scraper
        run: python -m pytest -q scraper/tests

      - name: Test preservation scripts
        run: python -m pytest -q scripts/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test web
        working-directory: web
        run: npm test -- --runInBand

      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Build web
        working-directory: web
        run: npm run build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST \
            "${VERCEL_DEPLOY_HOOK_URL}" \
            | jq .

      - name: Trigger Netlify deploy hook
        if: ${{ secrets.NETLIFY_DEPLOY_HOOK_URL != '' }}
        env:
          NETLIFY_DEPLOY_HOOK_URL: ${{ secrets.NETLIFY_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST \
            "${NETLIFY_DEPLOY_HOOK_URL}" \
            | jq .

      - name: Trigger Render deploy hook for this commit
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${DEPLOY_COMMIT}" \
            | jq .
