name: Deploy to Vercel + Netlify + Render

on:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r scraper/requirements.txt

      - name: Check Python dependency consistency
        run: pip check

      - name: Compile backend, scraper, and preservation scripts
        run: python -m compileall -q backend/app scraper scripts

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Check tracked files for committed secrets
        run: python scripts/check_tracked_secrets.py

      - name: Test backend
        working-directory: backend
        run: python -m pytest -q

      - name: Test scraper
        run: python -m pytest -q scraper/tests

      - name: Test preservation scripts
        run: python -m pytest -q scripts/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Audit web dependencies for high severity vulnerabilities
        working-directory: web
        run: npm audit --audit-level=high

      - name: Test web
        working-directory: web
        run: npm test -- --runInBand

      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Build web
        working-directory: web
        run: npm run build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK_URL}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --request POST \
            "${VERCEL_DEPLOY_HOOK_URL}" \
            | jq .

      - name: Trigger Netlify deploy hook
        env:
          NETLIFY_DEPLOY_HOOK_URL: ${{ secrets.NETLIFY_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${NETLIFY_DEPLOY_HOOK_URL}" ]; then
            echo "NETLIFY_DEPLOY_HOOK_URL is not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --request POST \
            "${NETLIFY_DEPLOY_HOOK_URL}" \
            | jq .

      - name: Trigger Render deploy hook for this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${DEPLOY_COMMIT}" \
            | jq .

      - name: Verify Render serves this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
          RENDER_HEALTH_URL: https://opencourseware-api.onrender.com/health
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping fingerprint verification."
            exit 0
          fi

          for attempt in $(seq 1 30); do
            body="$(curl --fail --silent --show-error "${RENDER_HEALTH_URL}" || true)"
            served_commit="$(printf '%s' "${body}" | jq -r '.git_commit // "unknown"' 2>/dev/null || echo unknown)"
            if [ "${served_commit}" = "${DEPLOY_COMMIT}" ]; then
              echo "Render is serving ${DEPLOY_COMMIT}."
              exit 0
            fi
            echo "Attempt ${attempt}: Render reports ${served_commit}; waiting for ${DEPLOY_COMMIT}."
            sleep 20
          done

          echo "Render did not report the deployed commit ${DEPLOY_COMMIT}." >&2
          exit 1
