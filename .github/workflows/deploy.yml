name: Deploy to Vercel + Netlify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          curl -s -X POST \
            "https://api.vercel.com/v1/integrations/deploy/prj_GSGPTvGL4NcbkOfEuALxfYciKoJD/nISy3LKS9k" \
            | jq .

      - name: Trigger Netlify deploy hook
        run: |
          curl -s -X POST \
            "https://api.netlify.com/build_hooks/6a109d9b686032636bca7782" \
            | jq .
