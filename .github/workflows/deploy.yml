name: Deploy to Vercel + Netlify

on:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r scraper/requirements.txt

      - name: Check tracked files for committed secrets
        run: python scripts/check_tracked_secrets.py

      - name: Test backend
        working-directory: backend
        run: python -m pytest -q

      - name: Test scraper
        run: python -m pytest -q scraper/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Test web
        working-directory: web
        run: npm test -- --runInBand

      - name: Build web
        working-directory: web
        run: npm run build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          curl -s -X POST \
            "https://api.vercel.com/v1/integrations/deploy/prj_GSGPTvGL4NcbkOfEuALxfYciKoJD/nISy3LKS9k" \
            | jq .

      - name: Trigger Netlify deploy hook
        run: |
          curl -s -X POST \
            "https://api.netlify.com/build_hooks/6a109dba40b10b6810218ca4" \
            | jq .
