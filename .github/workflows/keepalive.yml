name: Keepalive — Render API

on:
  schedule:
    # Ping every 5 minutes to ensure Render never cold-starts during ISR regeneration
    - cron: "*/5 * * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Warm Render + Netlify public API cache
        run: |
          BASE="https://opencourseware-explorer.netlify.app/api/v1"
          # Ping health directly on Render to keep it from sleeping
          curl -s -o /dev/null --max-time 55 "https://opencourseware-api.onrender.com/health" &
          # Warm the four course rows shown at launch.
          curl -s -o /dev/null "$BASE/courses/featured?page_size=36" &
          curl -s -o /dev/null "$BASE/courses?subject_slug=computer-science&page_size=36&has_thumbnail=true" &
          curl -s -o /dev/null "$BASE/courses?subject_slug=machine-learning&page_size=36&has_thumbnail=true" &
          curl -s -o /dev/null "$BASE/courses?subject_slug=artificial-intelligence&page_size=36&has_thumbnail=true" &
          wait
          echo "Cache warmed"
